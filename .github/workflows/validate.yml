
name: Website Validation

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'

  pull_request:
    branches:
      - main
      - develop

jobs:
  validate:
    name: Validate HTML and CSS
    runs-on: ubuntu-latest

    steps:
      - name: Get repository code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install HTMLHint and CSSLint
        run: |
          npm install --global htmlhint csslint

      - name: Validate HTML
        run: htmlhint index.html

      - name: Validate CSS
        run: csslint --quiet css/theme.css css/style.css
